<ng-scrollbar style="height: calc(100vh - 88px)" visibility="hover" orientation="vertical" [dir]="direction">
  @if (showContent) {
  <app-card cardClass="user-card" padding="10">
    <div class="text-center">

      <img [src]='profileImageSrc' class="rounded-circle d-block mx-auto mb-1" alt="Profile"
        style="width: 40px; height: 40px; object-fit: cover;" />
      <div class="fw-bold d-inline-flex align-items-center justify-content-center gap-1">
        {{userInfo?.name ? userInfo?.name : ''}}
        <i class="ti ti-chevron-down cp" href="javascript:" [matMenuTriggerFor]="menu"></i>
      </div>
      <div class="text-muted small">{{userRole}}</div>
      <div class="ps-2">

        <mat-menu #menu="matMenu" [overlapTrigger]="false" yPosition="below" xPosition="after">

          <button mat-menu-item>
            <a href="javascript:" class="text-muted" (click)="openProfileDialog()">
              <i class="ti ti-lock f-18 m-r-10"></i>
              <span>View Profile</span>
            </a>
          </button>
          <button mat-menu-item>
            <a href="javascript:" class="text-muted" (click)="logout()">
              <i class="ti ti-power f-18 m-r-10"></i>
              <span>Logout</span>
            </a>
          </button>
        </mat-menu>
      </div>

    </div>
  </app-card>
  }
  <div class="navbar-content">
    <ul class="nav coded-inner-navbar" (click)="fireOutClick()">
      @for (item of menus(); track item) {
      @if (item.type === 'group') {
      <app-menu-group-vertical [item]="item" style="width: 230px;" />
      } @else if (item.type === 'item') {
      <app-menu-item [item]="item" />
      } @else if (item.type === 'collapse') {
      <app-menu-collapse [item]="item" />
      }
      }
    </ul>
  </div>
</ng-scrollbar>
