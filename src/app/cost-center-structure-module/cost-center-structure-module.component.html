<div class="row">
    <div class="col-sm-12 px-0">
        <mat-card>
            <mat-card-content>
                <app-header-section [buttonOptions]="buttonOptions" [selectedButton]="selectedButton"
                    [loaderParent]="loaderParent" [isDisabledExport]="isDisabledExport" [trackByIndex]="trackByIndex"
                    [selectedTem]="selectedTem" [customers]="customers" [tems]="tems"
                    [currentOpenEditPagevar]="currentOpenEditPagevar" [addbuttonCondition]="selectedCCS === 0"
                    [tableDataExist]="tableDataExist" [viewNEdit]="viewNEdit" [trackByIndex]="trackByIndex"
                    (exportDataAsExcel)="onBtnExportCostCenterStructure()" (buttonClick)="onButtonClick($event)"
                    (filterGridByTEMId)="filterCCS()" (add)="OpenCostCenterstructureTab()"></app-header-section>

                <div class="table-responsive">
                    <mat-tab-group preserveContent=""
                        [(selectedIndex)]="selectedCCS" (selectedIndexChange)="changeCCS($event)"
                        [ngClass]="(!isTEMUser && !isCompanyUser) ? 'cost-center-repository-tab-group':''">
                        <mat-tab>
                            <div class="col-sm-12">
                                <ng-template mat-tab-label>
                                    <b><img src="assets/images/cost-center-structures.svg"
                                            alt="Cost Center Structures Image">&nbsp;Cost Center Structures</b>
                                </ng-template>
                            </div>
                            <ng-container>
                                <app-cost-center-structure-main [selectedTem]="selectedTemCCS"
                                    [selectedCustomer]="selectedCustomerCCS"
                                    (rowCellDoubleClicked)="editCostCenterStructure($event)"
                                    (selectedTemCCS)="selectedTemCCSEvent($event)" (isCCSData)="CCSDataExist($event)"
                                    (exportCCSExcelData)="exportCCSExcelData($event)"></app-cost-center-structure-main>
                            </ng-container>
                        </mat-tab>
                        <mat-tab *ngFor="let tabs of tabsArray;let i = index">
                            <ng-template mat-tab-label>
                                <b><svg version="1.0" xmlns="http://www.w3.org/2000/svg" width="23px"
                                        viewBox="0 0 203.000000 122.000000" preserveAspectRatio="xMidYMid meet">

                                        <g transform="translate(0.000000,122.000000) scale(0.100000,-0.100000)"
                                            fill="#4680ff" stroke="none">
                                            <path d="M637 1203 c-28 -7 -47 -60 -35 -96 14 -39 42 -47 174 -47 l114 0 0
                               -50 0 -49 -261 -3 -261 -3 -24 -28 c-22 -26 -24 -36 -24 -138 l0 -109 -80 0
                               -80 0 0 130 c0 117 -2 132 -20 150 -11 11 -33 20 -50 20 -17 0 -39 -9 -50 -20
                               -19 -19 -20 -33 -20 -350 0 -317 1 -331 20 -350 26 -26 74 -26 100 0 18 18 20
                               33 20 150 l0 130 80 0 80 0 0 -134 c0 -128 1 -136 24 -163 23 -26 29 -28 120
                               -31 l96 -4 65 -79 c100 -121 71 -114 485 -114 341 0 357 1 395 21 22 11 54 40
                               70 63 l30 43 3 279 c4 343 7 331 -127 442 -52 44 -106 80 -128 86 -21 6 -100
                               11 -175 11 l-138 0 0 50 0 50 113 0 c61 0 123 3 136 7 54 14 57 114 4 134 -24
                               9 -621 11 -656 2z m46 -517 c48 -44 48 -108 0 -152 -36 -33 -100 -33 -136 0
                               -71 66 -29 176 68 176 31 0 49 -7 68 -24z m300 0 c48 -44 48 -108 0 -152 -36
                               -33 -100 -33 -136 0 -71 66 -29 176 68 176 31 0 49 -7 68 -24z m300 0 c48 -44
                               48 -108 0 -152 -36 -33 -100 -33 -136 0 -71 66 -29 176 68 176 31 0 49 -7 68
                               -24z" />
                                            <path d="M1774 801 c-53 -23 -54 -29 -54 -393 l0 -337 24 -28 c23 -27 27 -28
                               121 -28 94 0 98 1 121 28 l24 28 0 339 0 339 -24 28 c-23 26 -30 28 -108 30
                               -45 2 -93 -1 -104 -6z" />
                                        </g>
                                    </svg> Cost Center Structure Rules Engine</b>

                                <mat-icon (click)="removeTabS(i)">cancel</mat-icon>
                            </ng-template>

                            <ng-template matTabContent>
                                <app-cost-center-structure [action]="tabs.tabTypes" [temValue]="tabs.temValue"
                                    [customerData]="tabs.customerValue"
                                    (onSaveCostCenterStructure)="onSaveCostCenterStructure($event, i)"
                                    (setTemDDValueEventCC)="setTemDDValueEventCCS($event)"
                                    [costCenterStructureRowData]="tabs.CostCenterStructureRowData"></app-cost-center-structure>
                            </ng-template>
                        </mat-tab>
                    </mat-tab-group>    
                </div>
            </mat-card-content>
        </mat-card>
    </div>
</div>
