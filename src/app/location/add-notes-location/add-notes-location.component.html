<mat-accordion>
    <mat-expansion-panel class="custom-panel border" [expanded]="true" [hideToggle]="true" [disabled]="true">
        <mat-expansion-panel-header class="custom-header">
            <div class="header-content">
                <svg class="pc-icon text-primary circle-icon" [ngClass]="{'disabled': loader}"  (click)="refreshbuttonEmitFn(true)">
                    <use xlink:href="assets/fonts/custom-icon.svg#refreshCircle"></use>
                </svg>
                <mat-panel-title class="panel-title">
                    <i class="fas fa-sticky-note text-primary" ></i> &nbsp;
                    <span class="fs-14 fw-bold text-dark">Location Notes</span>
                </mat-panel-title>
            </div>
        </mat-expansion-panel-header>


        <app-common-p-tree-table [refreshbutton]="refreshbutton" [payload]="payload" [GridAPI]="GridAPI" (tableDataExist)="tableDataExistFn($event)" [cols]="cols"  [multipleSelection]="true"
            (exportAccountData)="exportAccountDataFn($event)" (selectedRowsEmit)="selectedRowsEmitFn($event)" (rowCellDoubleClicked)="rowCellDoubleClickedFn($event)" [doubleHeader]="false" [filters]="false"
            (refreshbuttonEmit)="refreshbuttonEmitFn($event)" [headerCheckboxVisible]="true"
            (totalRecordsEmit)="totalRecordsEmitFn($event)"
            (loaderEmit)="loaderEmitFn($event)"
            [buttonTemplate]="buttonTemplateRef"
            />
    </mat-expansion-panel>
</mat-accordion>

<ng-template #buttonTemplateRef let-rowData="rowData">
    <div class="action-buttons" *ngIf="rowData?.IsLocationNoteAttachment">
        <i class="fas fa-file" (click)="buttonClickedForLocation(rowData)"></i>
    </div>
  </ng-template>
