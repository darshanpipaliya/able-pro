            <ng-template matTabContent>
                <ng-container>
                    <div class="summary-total-main">
                        <div class="banner">
                            <app-invoice-overview (reloadGrid)="reloadGrid($event)" [selectedTab]="selectedTab" [fromStep5]="true" [shoDayRemained]="true" [sandBoxGridRowData]="sandBoxGridRowData" (invoiceOverviewDataOutput)="invoiceOverviewDataOutput($event)"></app-invoice-overview>

                            <app-inventory-selection [reloadGrid]="refreshGrid" [isShowAddButton]="isDisplayVendorProduct" [recordPublishedOrCompleted]="recordPublishedOrCompleted" (onCellClicked)="redirectTab($event)" [sandBoxGridRowData]="sandBoxGridRowData" (redirectTab)="redirectToNext($event)"

                                ></app-inventory-selection>
                            </div>
                        </div>
                    </div>
                </ng-container>
            </ng-template>

        </mat-tab>

        <mat-tab [disabled]="index !== 1 && !isEnableTab || index == 0">
            <div class="col-sm-12">
                <ng-template mat-tab-label>
                    <b> <i class="fa fa-crosshairs" style="color: #4680ff;"></i> Select Inventory 5A</b>

                </ng-template>
            </div>
            <ng-container *ngIf="index == 1">
                <div class="summary-total-main">
                    <div class="banner">
                        <app-invoice-overview [shoDayRemained]="true" [selectedTab]="8" [sandBoxGridRowData]="sandBoxGridRowData" (invoiceOverviewDataOutput)="invoiceOverviewDataOutput($event)"></app-invoice-overview>
                        <div class="validate-summary-total-main">
                            <app-detailed-inventory-selection [recordPublishedOrCompleted]="recordPublishedOrCompleted" (onCellClicked)="onCellClicked($event)" [parentRowData]="rowData" [sandBoxGridRowData]="sandBoxGridRowData" [field]="field" [overviewData]="overviewData"></app-detailed-inventory-selection>
                        </div>
                    </div>
                </div>
            </ng-container>
        </mat-tab>

                </ng-template>
            </div>
            <ng-template matTabContent>
                <ng-container *ngIf="index == 2">
                    <div class="summary-total-main">
                        <div class="banner">
                            <app-invoice-overview [shoDayRemained]="true" [sandBoxGridRowData]="sandBoxGridRowData" (invoiceOverviewDataOutput)="invoiceOverviewDataOutput($event)"></app-invoice-overview>
                            <div class="validate-summary-total-main">
                                <app-assign-vendor-product [headerCheckboxData]="headerCheckboxData" [recordPublishedOrCompleted]="recordPublishedOrCompleted" [inventoryData]="inventoryData" [inventoryPayload]="inventoryPayload" [sandBoxGridRowData]="sandBoxGridRowData" (redirectTab)="onCellClicked($event)" [overviewData]="overviewData"></app-assign-vendor-product>
                            </div>
                        </div>
                    </div>
                </ng-container>
            </ng-template>
        </mat-tab>

        <mat-tab [disabled]="index !== 3">
            <div class="col-sm-12">
                <ng-template mat-tab-label>
                    <i class="ficon fas fa-puzzle-piece" style="color: #4680ff;"></i>&nbsp;<b> Add Product Different Account 5C </b>
                </ng-template>
            </div>
            <ng-template matTabContent>
                <ng-container *ngIf="index == 3">
                    <div class="summary-total-main">
                        <div class="banner">
                            <app-invoice-overview [shoDayRemained]="true" [sandBoxGridRowData]="sandBoxGridRowData" (invoiceOverviewDataOutput)="invoiceOverviewDataOutput($event)"></app-invoice-overview>
                            <div class="validate-summary-total-main">

                                (switchTab)="switchTab($event)"></app-select-assign-inventory>
                            </div>
                        </div>
                    </div>
                </ng-container>
            </ng-template>
