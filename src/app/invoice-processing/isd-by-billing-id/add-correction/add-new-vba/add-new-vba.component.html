<div class="mat-dialog-header pb-2">
    <div class="d-flex justify-content-between">
        <div class="text-center" style="width: calc(100% - 15px);">
            <h5 class="modal-title" id="exampleModalLabel">VBA</h5>
        </div>
        <button type="button" class="close ml-2" mat-dialog-close>
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
</div>
<form class="editForm" [formGroup]="addVendorBillingAliasForm">
    <mat-accordion class="example-headers-align">
        <mat-expansion-panel [expanded]="true">
            <mat-expansion-panel-header class="math borderc">
                <mat-panel-title class="matt">
                    <i class="ficon fas fa-user-ninja"></i>&nbsp;Billing Alias
                </mat-panel-title>

            </mat-expansion-panel-header>
            <div class="row m-t-20">
                <div class="col-md-12">
                    <div class="form-group">
                        <label class="form-label">Vendor *</label>
                        <span>
                            <p-dropdown appendTo="body" [options]="vendorsList" optionLabel="AccountName"
                                [filter]="true" filterBy="AccountName" [showClear]="true"
                                [ngClass]="{'invalid-error': f.vendorAccountId.invalid && (f.vendorAccountId.touched || isFormSubmit)}"
                                placeholder="Select Vendor..." formControlName="vendorAccountId" optionValue="Id"
                                [showClear]="false"></p-dropdown>
                        </span>
                        <ng-container *ngIf="f.vendorAccountId.invalid && (f.vendorAccountId.touched || isFormSubmit)">
                            <mat-error style="font-size: 12px;" *ngIf="f.vendorAccountId.errors.required">Vendor
                                is required
                            </mat-error>
                        </ng-container>
                    </div>
                </div>
                <div class="col-md-12">
                    <div class="form-group">
                        <label class="form-label">Vendor Billing Alias *</label>
                        <span> <input class="form-control" formControlName="name"
                                [ngClass]="{'invalid-error': !f.name.valid && (f.name.dirty || f.name.touched || isFormSubmit)}"
                                spaceTrimStartEndInput [allowStartWithSpace]="false"></span>
                        <ng-container *ngIf="f.name.invalid && (f.name.touched || isFormSubmit)">
                            <mat-error style="font-size: 12px;" *ngIf="f.name.errors.required">Vendor Billing
                                Alias is required
                            </mat-error>
                        </ng-container>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                    <div class="form-group">
                        <label class="form-label">Description *</label>
                        <span> <textarea class="form-control" [rows]="1"
                                [ngClass]="{'invalid-error': !f.description.valid && (f.description.dirty || f.description.touched || isFormSubmit)}"
                                formControlName="description"></textarea></span>
                        <ng-container *ngIf="f.description.invalid && (f.description.touched || isFormSubmit)">
                            <mat-error style="font-size: 12px;" *ngIf="f.description.errors.required">Description is
                                required
                            </mat-error>
                        </ng-container>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                    <div class="form-group">
                        <label class="form-label">Status * </label>
                        <span>
                            <p-dropdown [options]="statusList" optionLabel="Name" [filter]="false" filterBy="Name"
                                [showClear]="true" placeholder="Select Status..." formControlName="status"
                                appendTo="body" optionValue="Id" [showClear]="false"
                                [ngClass]="{'invalid-error': f.status.invalid && (f.status.touched || isFormSubmit)}">
                            </p-dropdown>
                        </span>
                        <ng-container *ngIf="f.status.invalid && (f.status.touched || isFormSubmit)">
                            <mat-error style="font-size: 12px;" *ngIf="f.status.errors.required">Status is
                                required
                            </mat-error>
                        </ng-container>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12 d-flex">
                    <div style="padding-right: 30px;">
                        <div class="form-group">
                            <div class="form-check pl-0" style="display: flex; align-items: center;">
                                <label for="charge-code-check" class="form-check-label pr-1" style="font-weight: 500;">
                                    Charge Code Alias </label>
                                <input type="checkbox" formControlName="chargeCodeAlias" id="charge-code-check"
                                    class="form-check-inner">

                            </div>
                        </div>
                    </div>
                    <div>
                        <div class="form-group">
                            <div class="form-check pl-0" style="display: flex; align-items: center;">

                                <label for="defaultCheck1" class="form-check-label pr-1" style="font-weight: 500;">
                                    Invoice Alias </label>
                                <input type="checkbox" formControlName="invoiceAlias" id="defaultCheck1"
                                    class="form-check-inner">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </mat-expansion-panel>
    </mat-accordion>
    <div class="form-group text-center margin-b-none mt-3">
        <button type="submit" uiSref="work" class="btn sbubtn btn-primary btn-raised" [disabled]="saveButtonLoadder"
            (click)="addBillingAlias()">Save</button>
    </div>
</form>
