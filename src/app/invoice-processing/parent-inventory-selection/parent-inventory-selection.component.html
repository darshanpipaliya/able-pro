<div class="row" >
    <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12">
        <div class="validate-summary-total-right sandbox-step-grid">
            <mat-accordion class="example-headers-align vba-accordion">
                <mat-expansion-panel style="width: 100%;" [expanded]="true" [disabled]="true">
                    <button type="button" class="fas fa-check c-refresh-speed" title="Refresh" [ngClass]="{'disabled': recordPublishedOrCompleted}" (click)="onAgGridReady(this.gridApi.api ? this.gridApi.api : this.gridApi)"></button>
                    <mat-expansion-panel-header class="math">
                        <mat-panel-title class="matt">
                            <i class="ficon fas fa-tools"></i>&nbsp;Vendor Product Charge Code Group
                        </mat-panel-title>
                        
                    </mat-expansion-panel-header>
                    <div class="row">
                        <div class="col-md-12 px-0">
                            <ng-container style="height: max-content;">
                                <app-ag-grid-table [columnDefs]="columnDefs" [rowData]="rowData" (onAgGridReady)="onAgGridReady($event)"
                                    [sheetName]="'Charge Code'" [exportFilename]="'Charge Code.xlsx'" [gridOptions]="gridOptions"
                                    [rowSelection]="rowSelection"
                                    [defaultColDef]="defaultColDef" [sideBar]="sideBar" [singleClickEdit]="true"
                                    (onAgGridReadyEmit)="onAgGridReadyEmit($event)">
                                </app-ag-grid-table>
                            </ng-container>
                        </div>
                    </div>

                </mat-expansion-panel>
            </mat-accordion>
        </div>
    </div>
</div>
