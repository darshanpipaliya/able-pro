<div class="row">
    <div class="col-12">
        <div class="validate-summary-total-right sandbox-step-grid second">
            <mat-accordion class="example-headers-align accordion-toggle-btn-right vba-accordion">
                <mat-expansion-panel style="width: 100%;" [expanded]="true">
               
                    <div class="publish-btn">
                        <button class="btn btn-primary btn-raised" (click)="specificDistribution()" [disabled]="selectedRecords.length == 0 || recordPublishedOrCompleted">Specific Distribution</button>
                        <button class="btn btn-primary btn-raised" (click)="approve()" [disabled]="recordPublishedOrCompleted || selectedRecords.length > 0 || saveButtonLoader || overviewData?.Differences !== 0">
                            <span class="spinner-border spinner-border-sm mr-1" role="status" *ngIf="saveButtonLoader"></span>
                            Approve</button>
                            <button title="Export" [disabled]="isDisabledExport || files?.length == 0 || recordPublishedOrCompleted"
                            type="button" class="btn btn-outline-success custome-export"
                            (click)="onBtnExportDataAsExcel()">
                            <i class="{{isDisabledExport ? 'spinner-border spinner-border-sm' : 'fas fa-file-excel f-14'}} "></i>
                        </button>
                    </div>
                    <mat-expansion-panel-header class="math">
                        <mat-panel-title class="matt">
                            <i class="fas fa-file-invoice-dollar"
                                style="color: #4680ff; font-size: 15px;"></i>&nbsp;&nbsp;Invoice
                            Summary

                        </mat-panel-title>
                    </mat-expansion-panel-header>

                    <p-treeTable #treeTable [value]="files" columnResizeMode="expand" [columns]="displaycols"
                        [sortMode]="'multiple'" [rows]="10" [lazy]="true" [totalRecords]="totalRecords"
                        (onLazyLoad)="loadNodes($event)" [scrollable]="true" [resizableColumns]="true"
                        selectionMode="checkbox" selectionMode="single" [reorderableColumns]="true"
                        (onColResize)="handleColumnResize($event)" [(selection)]="selectedRecords">
                        <!-- style="overflow-x: scroll;" -->

                        <ng-template pTemplate="colgroup" let-columns>
                            <colgroup>
                                <ng-container *ngFor="let col of columns">
                                    <col
                                        [ngStyle]="{'width': col.width || 'auto', 'min-width': col.width || '100px'}" />
                                </ng-container>
                            </colgroup>
                        </ng-template>

                        <ng-template pTemplate="header" let-columns>
                            <tr class="header-row p-treetable-thead-parent">
                                <ng-container *ngFor="let col of cols">
                                    <ng-container *ngIf="col.isChildren && col.isParentVisible">
                                        <th [attr.data-parent-id]="col.parent" [attr.colspan]="col.colspan"
                                            ttResizableColumn class="parent-header"
                                            [ngStyle]="{'width': col.parentWidth || 'auto', 'height': '50px' }">
                                            <span>{{ col.header }}</span>
                                            <i class='pi pi-fw pi-chevron-right icon-contracted'
                                                *ngIf="!innerLoading && col.isChildren && col.isicon == 1 && col.isToggle"
                                                (click)="toggleColumn(col.parent , 'close')"></i>
                                            <i class='pi pi-fw pi-chevron-left icon-expanded'
                                                *ngIf="!innerLoading && col.isChildren && col.isicon == 0 && col.isToggle"
                                                (click)="toggleColumn(col.parent , 'open')"></i>
                                        </th>
                                    </ng-container>
                                </ng-container>
                            </tr>

                            <tr class="header-row p-treetable-thead-child">
                                <ng-container *ngFor="let col of columns">
                                    <ng-container>
                                            <th ttResizableColumn ttReorderableColumn (click)="OrderBy(col.field  )"
                                                class="child-header" [ngStyle]="{'width': col.width || 'auto', 'height': '50px' }">
                                                {{ col.childHeader }}
                                                <i class='pi pi-arrow-up' *ngIf="col.sorting === 'asc'"></i>
                                                <i class='pi pi-arrow-down' *ngIf="col.sorting === 'desc'"></i>
                                            </th>
                                    </ng-container>
                                </ng-container>
                                
                            </tr>

                            <tr class="header-row p-treetable-thead-filter">
                                <ng-container *ngFor="let col of columns">
                                    <ng-container>
                                        <th class="child-header" [ngStyle]="{'width': col.width || 'auto', 'height': '40px'}">
                                            <input type="text" [(ngModel)]="col.valuesset" [disabled]="col.isenable" pInputText
                                                size="8" *ngIf="col.type === 'text'" (input)="filerOutSide($event, col)"
                                                style="width: auto" />
            
                                            <input type="text" OnlyNumber [allowNegative]="true" [(ngModel)]="col.valuesset" [disabled]="col.isenable"
                                                pInputText size="8" *ngIf="col.type === 'numberFilter'"
                                                (input)="filerOutSide($event, col)" style="width: auto" />
            
                                            <p-calendar dateFormat="mm-dd-yy" class="p-treeTable-calender-grid"
                                                [disabled]="col.isenable" (ngModelChange)="filerOutSide($event, col)"
                                                *ngIf="col.type === 'dateFilter' && !col.isenable" [(ngModel)]="col.valuesset"
                                                placeholder="mm-dd-yyyy" appendTo="body" [showIcon]="true">
                                            </p-calendar>
            
                                            <input type="text" *ngIf="col.type === 'dateFilter' && col.isenable"
                                                [(ngModel)]="col.valuesset" [disabled]="col.isenable" pInputText size="8"
                                                style="width: auto" />
            
                                            <button *ngIf="col.field !== 'checkbox'" type="text" pButton icon="pi pi-filter-icon pi-filter icon-filter"
                                                (click)="openContextMenu($event,col)"></button>
                                        </th>
                                    </ng-container>
                                </ng-container>
                            </tr>
                        </ng-template>
                        <!-- [ngClass]="{'disabled-row': isRowDisabled(rowNode)}" -->
                        <ng-template pTemplate="body" let-rowNode let-rowData="rowData" let-columns="columns">
                            <tr class="body-row" >
                                <ng-container *ngFor="let col of columns;  let i = index">
                                    <ng-container>
                                        <td [(selection)]="selectedNode"
                                            (contextmenu)="showContextMenu($event, contextMenu , rowData[col.field])"
                                            class="cell"
                                            [ngStyle]="{'width': col.width || 'auto', 'height': '40px', 'text-align': (col.field === 'TotalChargeDisplay' || col.field == 'ChargeDisplay' || col.field == 'TotalPreChargeCodeChargeDisplay' || col.field == 'PreChargeCodeChargeDisplay' || col.field == 'ProductDiffPerDisplay' || col.field == 'ProductDiffDisplay' || col.field == 'ChargeCodeDiffPerDisplay' || col.field == 'ChargeCodeDiffDisplay') ? 'right' : 'left'}">
                                            <ng-container [ngSwitch]="col.field">
                                                <span *ngSwitchCase="'checkbox'">
                                                    <div style="display: flex; align-items: center; justify-content: center; height: 100%;" *ngIf="!isRowDisabled(rowNode)">
                                                        <p-treeTableCheckbox [value]="rowNode"
                                                            (click)="selectChildCheckbox()">
                                                        </p-treeTableCheckbox>
                                                    </div>
                                                </span>
                                               
                                                <span *ngSwitchDefault>{{ rowData[col.field] }}</span>
                                            </ng-container>

                                        </td>
                                    </ng-container>
                                </ng-container>
                            </tr>
                        </ng-template>

                        <ng-template pTemplate="emptymessage" let-columns>
                            <tr>
                                <td class="cell" [attr.colspan]="columns.length">
                                    <span class="spinner-border spinner-border-sm" role="status" *ngIf="loading"></span>
                                    <span *ngIf="!loading && totalRecords === 0">
                                        No Record Found
                                    </span>
                                </td>
                            </tr>
                        </ng-template>
                    </p-treeTable>

                    <div class="custome-side-buttons">
                        <div class="custome-side-button" [ngClass]="{'active-border': sidebarVisible }">
                            <!-- vericaltext -->
                            <a class="custom-side-button-button ag-icon ag-icon-columns" (click)="openSidebar()">
                                <!-- <i class="fa fa-check"></i>  -->
                                Columns</a>
                        </div>
                    </div>

                    <div class="sidebar" *ngIf="sidebarVisible">
                        <div class="sidebar-content">
                            <p-tree [value]="filesColumns" selectionMode="checkbox" (onNodeSelect)="nodeSelect($event)"
                                (onNodeUnselect)="nodeUnselect($event)" [(selection)]="selectedFiles"> </p-tree>
                        </div>
                    </div>
                    <p-contextMenu
                        [style]="{'left': contextMenuPosition.x + 'px', 'top': contextMenuPosition.y + 'px' ,'position': 'fixed'}"
                        #contextMenu [model]="items"></p-contextMenu>

                </mat-expansion-panel>
            </mat-accordion>
            <!-- <div class="text-right mt-2 mr-3">
                {{totalRecords}} {{totalRecords > 1 ? 'records' : 'record'}}
            </div> -->
        </div>
    </div>
</div>


<p-dialog [(visible)]="displayModal" modal="true" [closable]="true" [draggable]="false" [resizable]="false"
    [dismissableMask]="true" [header]="''" #treeTable
    [style]="{'left': contextMenuPosition.x + 'px', 'top': contextMenuPosition.y + 'px' ,'position': 'fixed'}">
    <div class="modal-body">
        <div class="row">
            <div class="col-md-12 mb-2">

                <p-dropdown [(ngModel)]="selectedOption1" class="rounded-inputs20 select-select col-md-12"
                    [options]="countries" optionValue="name" optionLabel="display" appendTo="body">
                </p-dropdown>

            </div>
        </div>

        <div class="row" *ngIf="fieldsName?.type === 'text' ">
            <div class="col-md-12">
                <input type="text" [(ngModel)]="textboxValue1"
                    placeholder="{{selectedOption1 === 'inrange' ? 'From' : 'Filter...'}}"
                    (input)="onFilterChangedFirst($event)" pInputText size="8" style="width: auto" />
            </div>
        </div>
        <div class="row" *ngIf="fieldsName?.type === 'numberFilter' ">
            <div class="col-md-12">
                <input type="text" OnlyNumber [(ngModel)]="textboxValue1"
                    placeholder="{{selectedOption1 === 'inrange' ? 'From' : 'Filter...'}}"
                    (input)="onFilterChangedFirst($event)" pInputText size="8" style="width: auto" />
            </div>
        </div>
        <div class="row" *ngIf="fieldsName?.type === 'dateFilter' ">
            <div class="col-md-12">
                <p-calendar dateFormat="mm-dd-yy" class="p-treeTable-calender"
                    (ngModelChange)="onFilterChangedFirst($event)" [(ngModel)]="textboxValue1" placeholder="mm-dd-yyyy"
                    appendTo="body" [showIcon]="true"></p-calendar>
            </div>
        </div>

        <!-- First In Range -->
        <div *ngIf="selectedOption1 == 'inrange'">
            <div class="row" *ngIf="fieldsName?.type === 'text' ">
                <div class="col-md-12">
                    <input type="text" [(ngModel)]="textboxValue1_1" placeholder="To"
                        (input)="onFilterChangedFirst($event)" pInputText size="8" style="width: auto" />
                </div>
            </div>
            <div class="row" *ngIf="fieldsName?.type === 'numberFilter' ">
                <div class="col-md-12">
                    <input type="text" OnlyNumber [(ngModel)]="textboxValue1_1" placeholder="To"
                        (input)="onFilterChangedFirst($event)" pInputText size="8" style="width: auto" />
                </div>
            </div>
            <div class="row" *ngIf="fieldsName?.type === 'dateFilter' ">
                <div class="col-md-12">
                    <p-calendar dateFormat="mm-dd-yy" class="p-treeTable-calender"
                        (ngModelChange)="onFilterChangedFirst($event)" [(ngModel)]="textboxValue1_1"
                        placeholder="mm-dd-yyyy" appendTo="body" [showIcon]="true"></p-calendar>
                </div>
            </div>
        </div>

        <!-- First In Range Over -->
        <div class="row my-1" *ngIf="displayModal1">
            <div class="col-md-12 d-flex justify-content-center condition-label">
                <label *ngFor="let radiobutton of radioItems">
                    <input type="radio" name="options" (click)="model.option = radiobutton"
                        [checked]="radiobutton === model.option" />{{ radiobutton }}
                </label>
            </div>
        </div>

        <div class="row" *ngIf="displayModal1">
            <div class="col-md-12 mb-2">

                <p-dropdown [(ngModel)]="selectedOption2" class="rounded-inputs20 select-select col-md-12"
                    [options]="countries" optionValue="name" optionLabel="display" appendTo="body">
                </p-dropdown>
            </div>
        </div>

        <!-- -------------- -->

        <div class="row" *ngIf="displayModal1 && fieldsName?.type === 'text' ">
            <div class="col-md-12">
                <input placeholder="{{selectedOption2 === 'inrange' ? 'From' : 'Filter...'}}" type="text"
                    [(ngModel)]="textboxValue2" pInputText size="8" style="width: auto" />
            </div>
        </div>

        <div class="row" *ngIf="displayModal1 && fieldsName?.type === 'numberFilter' ">
            <div class="col-md-12">
                <input placeholder="{{selectedOption2 === 'inrange' ? 'From' : 'Filter...'}}" type="text" OnlyNumber
                    [(ngModel)]="textboxValue2" pInputText size="8" style="width: auto" />
            </div>
        </div>

        <div class="row" *ngIf="displayModal1 && fieldsName?.type === 'dateFilter' ">
            <div class="col-md-12">
                <p-calendar dateFormat="mm-dd-yy" class="p-treeTable-calender" [(ngModel)]="textboxValue2"
                    placeholder="mm-dd-yyyy" appendTo="body" [showIcon]="true"></p-calendar>
            </div>
        </div>

        <!-- Second In Range -->
        <div *ngIf="displayModal1 && selectedOption2 == 'inrange'">
            <div class="row" *ngIf="fieldsName?.type === 'text' ">
                <div class="col-md-12">
                    <input type="text" [(ngModel)]="textboxValue2_1" placeholder="To" pInputText size="8"
                        style="width: auto" />
                </div>
            </div>

            <div class="row" *ngIf="fieldsName?.type === 'numberFilter' ">
                <div class="col-md-12">
                    <input type="text" OnlyNumber [(ngModel)]="textboxValue2_1" placeholder="To" pInputText size="8"
                        style="width: auto" />
                </div>
            </div>

            <div class="row" *ngIf="fieldsName?.type === 'dateFilter' ">
                <div class="col-md-12">
                    <p-calendar dateFormat="mm-dd-yy" class="p-treeTable-calender" [(ngModel)]="textboxValue2_1"
                        placeholder="mm-dd-yyyy" appendTo="body" [showIcon]="true">
                    </p-calendar>

                </div>
            </div>
        </div>
        <!-- Second In Range Over -->
        <!-- -------------- -->



        <div class="row" style="margin-top: 10px;">
            <div class="col-md-12">
                <button type="text" class="btn btn-primary btn-sm" pButton (click)="onFilterChangedValue()">
                    Apply
                </button>
            </div>
        </div>
    </div>
</p-dialog>
