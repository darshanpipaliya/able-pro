<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<div class="row">
    <div class="col-sm-12 px-0">
        <mat-card class="">
            <mat-card-content>
                <div class="row header-btn-responsive">
                    <ng-container *ngFor="let option of buttonOptions">
                        <button ngDefaultControl class="bbtn  btn btn-outline-primary" type="button"
                            [ngClass]="(option.value === 'products') ? 'btn btn-primary active round bg' : 'btn round'"
                            [value]="option.value" (click)="goToPage(option.value);selected=0;">
                            <!---- <ng-container *ngIf="option.value === 'vendors'"><i class="fas fa-gopuram"> </i>
                            </ng-container>
                            <ng-container *ngIf="option.value === 'users'"><i class="fas fa-gopuram"> </i>
                            </ng-container>-->
                            <ng-container><i class="fas {{option.icon}}"> </i>
                            </ng-container>
                            {{option.label}}
                        </button>
                    </ng-container>
                </div>
                <div class="row btn-group-list" *ngIf="currentOpenEditPagevar == 'Table'">

                    <button [ngClass]="{'disabled': isDisabledExport || productsRowData.length < 1}" title="Export"
                        type="button" class=" btn btn-icon btn-outline-success m-r-8"
                        (click)="!isDisabledExport ? onBtnExportDataAsExcel() : ''">
                        <i class="{{isDisabledExport ? 'spinner-border spinner-border-sm' : 'fas fa-file-excel'}} "></i>
                    </button>
                    <button title="Add Product" type="button" *ngIf="addBtnPermission"
                        class="btn btn-icon btn-outline-primary" (click)="addProduct()"> <i
                            class="fas fa-plus"></i></button>
                </div>
                <div class="table-responsive">
                    <mat-tab-group [selectedIndex]="selected" (selectedIndexChange)="changeTab($event)"
                        id="products-table-tab"
                        [ngClass]="{'mat-tab-header-add' : currentOpenEditPagevar === 'Add', 'mat-tab-header-edit' : currentOpenEditPagevar === 'Edit'}">
                        <mat-tab>
                            <ng-template mat-tab-label>
                                <b><i class="fas fa-box-open" style="color: #4680ff;"> </i>
                                    Products</b>
                            </ng-template>

                            <div class="col-sm-12 px-0">
                                <div class="mt-2">
                                    <mat-accordion class="example-headers-align accordion-grid ">
                                        <mat-expansion-panel style="width: 100%;" [expanded]="true" [disabled]="true">
                                            <button type="button" class="fas fa-check c-refresh-speed" title="Refresh"
                                                (click)="onAgGridReady(this.gridApi.api ? this.gridApi.api : this.gridApi)"></button>
                                            <mat-expansion-panel-header class="math">
                                                <mat-panel-title class="matt font-weight-bold">
                                                    <i class="fas fa-box-open"
                                                        style="color: #4680ff;"></i>&nbsp;Products
                                                </mat-panel-title>
                                            </mat-expansion-panel-header>
                                            <app-ag-grid-table [columnDefs]="columnDefs" [rowData]="rowData"
                                                [rowSelection]="rowSelection" [sheetName]="'Product'"
                                                [exportFilename]="'Products.xlsx'"
                                                [defaultColDef]="defaultColDef" [sideBar]="sideBar"
                                                [singleClickEdit]="true" (onCellClickedEvent)="onCellClicked($event)"
                                                [gridOptions]="gridOptions"
                                                (onCellDoubleClickedEvent)="onCellDoubleClicked($event)"
                                                (onAgGridReadyEmit)="onAgGridReadyEmit($event)"
                                                (onAgGridReady)="onAgGridReady($event)"
                                                (onCellEditingStoppedEvent)="onCellEditingStoppedEventForCL($event.data)">
                                            </app-ag-grid-table>
                                        </mat-expansion-panel>
                                    </mat-accordion>
                                    <div class="row">
                                        <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 px-0">
                                            <div class="text-right mt-2 mr-3">
                                            <span>
                                                {{girdDataCount}} {{girdDataCount > 1 ? 'records' : 'record'}}
                                            </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </mat-tab>

                        <ng-container *ngFor="let productData of editProductsArray;let i = index">
                            <mat-tab>
                                <ng-template mat-tab-label>
                                    <i class="fas fa-edit" style="color: #4680ff;"></i>&nbsp;
                                    {{productData.ProductTypeName}}&nbsp;<mat-icon (click)="removeTab(i)">cancel
                                    </mat-icon>
                                </ng-template>
                                <ng-template matTabContent>
                                    <app-edit-product (currentOpenEditPage)="currentOpenEditPage($event)"
                                        [productData]="productData"
                                        (onUserAddEvent)="onUserAddEvent($event, i, 'edit')"></app-edit-product>
                                </ng-template>
                            </mat-tab>
                        </ng-container>
                        <ng-container *ngFor="let user of addProductsArray;let i = index">
                            <mat-tab>
                                <ng-template mat-tab-label>
                                    <i class="fas fa-box-open" style="color: #4680ff;"></i>&nbsp;Add Product&nbsp;
                                    <mat-icon (click)="removeUser(i)">cancel</mat-icon>
                                </ng-template>
                                <ng-template matTabContent>
                                    <app-add-product (currentOpenEditPage)="currentOpenEditPage($event)"
                                        (onUserAddEvent)="onUserAddEvent($event)"
                                        [removeClose]="true"></app-add-product>
                                </ng-template>
                            </mat-tab>
                        </ng-container>
                        <ng-container *ngFor="let upload of uploadProductsArray;let i = index">
                            <mat-tab>
                                <ng-template mat-tab-label>
                                    <i class="fas fa-cloud-upload-alt" style="color: #4680ff;"> </i>&nbsp;Upload&nbsp;
                                    <mat-icon (click)="removeUploadPage(i)">cancel</mat-icon>
                                </ng-template>
                                <ng-template matTabContent>
                                    <app-files-upload></app-files-upload>
                                </ng-template>
                            </mat-tab>
                        </ng-container>
                    </mat-tab-group>
                </div>
            </mat-card-content>
        </mat-card>
    </div>
</div>
