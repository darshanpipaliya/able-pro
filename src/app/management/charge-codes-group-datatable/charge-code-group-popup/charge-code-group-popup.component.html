<div class="mat-dialog-header pb-3">
    <h5 class="modal-title text-c-blue">Attention</h5>
    <i class="fas fa-times" type="button" mat-dialog-close (click)="closeDialog()"></i>
</div>

<div class="row pt-3">
    <div class="col-sm-12 px-0">
        <div>
            <div class="d-flex align-items-center mb-2">
                <i class="fas fa-question-circle text-c-blue mr-3" style="font-size: 45px;"></i>
                <p class="mb-2 text-c-blue"> 
                    The group you created matches an existing group, <i class="link-text" (click)="update(data)">{{data.GroupId}} </i> , within this Vendor Product. We can update the existing group to include any additional charge codes. Would you like to deactivate the newly created group and use the existing one instead? 
                </p>
            </div>

        </div>
        <div>
            <ng-container>
                <div class="text-right mt-2">
                    <a  class="link-text" (click)="saveCorrection()">Do It!</a>
                    <button class="btn btn-primary ml-4" (click)="closeAndReview()">
                        Close & Review</button>
                </div>
            </ng-container>
        </div>
    </div>
</div>
