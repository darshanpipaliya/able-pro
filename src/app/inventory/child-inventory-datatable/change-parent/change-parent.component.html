<div class="mat-dialog-header pb-2">
    <div>
        <h5 class="modal-title" id="exampleModalLabel">Change Parent of Child to Another Parent</h5>
    </div>

    <button type="button" class="close" mat-dialog-close>
        <span aria-hidden="true">&times;</span>
    </button>
</div>
<div mat-dialog-content>
    <div class="card-body py-0">
        <div class="container px-0">
            <form class="editForm px-0" [formGroup]="inventoryForm">

                <div class="row" style="margin-top: 10px !important;">
                    <div class="col-lg-6 child-record-left-section">
                        <div class="row">
                            <div class="col-sm-12 col-xl-12 col-md-12 px-0">
                                <h5 class="modal-title mb-1" id="exampleModalLabel">Child Record</h5>
                                <div class="row m-t-10">
                                    <div class="col-md-6 col-xl-6 padding-0-3">
                                        <div class="form-group"> <label class="form-label">Customer</label>
                                            <span><p-dropdown
                                                    placeholder="{{loadingDetails ? 'Loading' :'Select Customer'}}..."
                                                    [options]="customers" optionValue="Id"
                                                    optionLabel="AccountName" formControlName="customerId"
                                                    appendTo="body" [showClear]="false">
                                                </p-dropdown>
                                            </span>
                                        </div>
                                    </div>
                                    <div class="col-md-6 col-xl-6 padding-3-0">
                                        <div class="form-group"> <label class="form-label">Vendor</label>
                                            <p-dropdown
                                                placeholder="{{loadingDetails ? 'Loading' : 'Select Vendor'}}..."
                                                optionLabel="AccountName" optionValue="Id" [options]="vendorsList"
                                                appendTo="body" formControlName="VendorId" [showClear]="false">
                                            </p-dropdown>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 col-xl-6 padding-0-3">
                                        <div class="form-group"> <label class="form-label">Main Account Number</label>
                                            <input class="form-control" formControlName="MainAccountNumber">
                                        </div>
                                    </div>
                                    <div class="col-md-6 col-xl-6 padding-3-0">
                                        <div class="form-group"> <label class="form-label">Sub Account Number</label>
                                            <input class="form-control" formControlName="subAccountNumber">
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 col-xl-6 padding-0-3">
                                        <div class="form-group"> <label class="form-label">Service Custom 1</label>
                                            <input class="form-control" formControlName="inventoryCustomField1">
                                        </div>
                                    </div>
                                    <div class="col-md-6 col-xl-6 padding-3-0">
                                        <div class="form-group"> <label class="form-label">Service Custom 2</label>
                                            <input class="form-control" formControlName="inventoryCustomField2">
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 col-xl-6 padding-0-3">
                                        <div class="form-group"> <label class="form-label">Service Custom 3</label>
                                            <input class="form-control" formControlName="inventoryCustomField3">
                                        </div>
                                    </div>
                                    <div class="col-md-6 col-xl-6 padding-3-0">
                                        <div class="form-group"> <label class="form-label">Service Custom 4</label>
                                            <input class="form-control" formControlName="inventoryCustomField4">
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 col-xl-6 padding-0-3">
                                        <div class="form-group"> <label class="form-label">Service Number</label> <input
                                                class="form-control" formControlName="serviceNumber"> </div>
                                    </div>
                                    <div class="col-md-6 col-xl-6 padding-3-0">
                                        <div class="form-group"> <label class="form-label">Billing ID</label> <input
                                                class="form-control" formControlName="billingId">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 current-parent-record-right-section">
                        <div class="row">
                            <div class="col-sm-12 col-xl-12 col-md-12 px-0">
                                <h5 class="modal-title mb-1" id="exampleModalLabel">Current Parent Record</h5>
                                <div class="row m-t-10">
                                    <div class="col-md-6 col-xl-6 padding-0-3">
                                        <div class="form-group"> <label class="form-label">Product</label> <input
                                                class="form-control" formControlName="product">

                                        </div>
                                    </div>
                                    <div class="col-md-6 col-xl-6 padding-3-0">
                                        <div class="form-group"> <label class="form-label">Product Type</label> <input
                                                class="form-control" formControlName="productType"> </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 col-xl-6 padding-0-3">
                                        <div class="form-group"> <label class="form-label">Main Account Number</label>
                                            <input class="form-control" formControlName="MainAccountNumber2">

                                        </div>
                                    </div>
                                    <div class="col-md-6 col-xl-6 padding-3-0">
                                        <div class="form-group"> <label class="form-label">Sub Account Number</label>
                                            <input class="form-control" formControlName="subAccountNumber2">

                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 col-xl-6 padding-0-3">
                                        <div class="form-group"> <label class="form-label">Vendor Product</label>
                                            <p-dropdown placeholder="{{loadingDetails ? 'Loading' :'Select Vendor Product'}}..."
                                                [options]="vendorProducts" formControlName="vendorProductTypeId"
                                                appendTo="body" optionValue="Id" optionLabel="Name" [showClear]="false">
                                            </p-dropdown>
                                        </div>
                                    </div>
                                    <div class="col-md-6 col-xl-6 padding-3-0">
                                        <div class="form-group"> <label class="form-label">Status</label>
                                            <p-dropdown placeholder="{{loadingDetails ? 'Loading' :'Select Status'}}..."
                                                [options]="inventoryStatusList" appendTo="body"
                                                formControlName="statusId" optionValue="Id" optionLabel="DisplayText"
                                                [showClear]="false">
                                            </p-dropdown>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-12 col-xl-12 px-0">
                                        <div class="form-group"> <label class="form-label">Vendor Product
                                                Description</label>
                                            <input class="form-control" formControlName="VendorProductDescription">

                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 col-xl-6 padding-0-3">
                                        <div class="form-group"> <label class="form-label">Service Number</label> <input
                                                class="form-control" formControlName="serviceNumber2"> </div>
                                    </div>
                                    <div class="col-md-6 col-xl-6 padding-3-0">
                                        <div class="form-group"> <label class="form-label">Billing ID</label> <input
                                                class="form-control" formControlName="billingId2">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12 pl-0 mt-2">
                        <h5 class="modal-title" id="exampleModalLabel">Select New Parent Record for Inventory Assignment
                            <i class="fas fa-info-circle" container="body"
                                ngbTooltip="Search for a new Parent Inventory record by Location, Service Number, Vendor, Account, and other fields in order to locate and select the Parent record for this inventory item"
                                tooltipClass="tooltip-bg"></i>
                        </h5>

                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-12 col-xl-12 col-md-12 m-t-10 change-parent-grid p-0">

                        <app-p-tree-table-select-inventory [inventoryData]="inventoryData" [serviceIds]="serviceIds"
                        (selectedRowsEmit)="onSelectionChanged($event)">
                        </app-p-tree-table-select-inventory>

                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<mat-dialog-actions class="py-3" align="center">
    <button mat-button class="btn btn-primary" (click)="saveChangedParent()"
        [disabled]="!isRowSelected || saveButtonDisabled">
    <span class="spinner-border spinner-border-sm" role="status" *ngIf="saveButtonDisabled"></span>
        Save</button>
</mat-dialog-actions>
