<div class="mat-dialog-header pb-3">
    <h5 class="modal-title text-c-blue">Upload Data Files</h5>
    <i class="fas fa-times" type="button" [mat-dialog-close]="close"></i>
</div>
<div class="row mt-1">
    <div class="col-sm-12 px-0">
        <div class="text-c-blue">
            <p>
                Use this page to upload the data files for this retrieval record. Drag and drop the files into the box
                below, or click "Browse for file" to locate
                and select the corresponding file.
            </p>
            <p>
                Click the "Upload & Validate" button to initiate the upload
            </p>
        </div>
        <div class="mt-2">

            <p-fileUpload name="demo[]" [showCancelButton]="false" [chooseLabel]="'Browse files'"
                (onSelect)="onUpload($event)" [multiple]="true" [showUploadButton]="false" (onRemove)="onRemove($event)">
            </p-fileUpload>

          
            <ng-container>
                <div class="text-center mt-4">
                    <button class="btn btn-primary" (click)="uploadFile()" [disabled]="selectedFiles.length == 0">
                        Upload & Validate</button>
                </div>
            </ng-container>
        </div>
    </div>
</div>
