<div class="mat-dialog-header pb-3">
    <h5 class="modal-title text-c-blue">Terminate Retrieval</h5>
    <i class="fas fa-times" type="button" mat-dialog-close (click)="closeDialog()"></i>
</div>
<div class="row pt-3">
    <div class="col-sm-12 px-0">
        <div>
            <div class="d-flex align-items-center text-c-blue">
                <!-- fas fa-exclamation-circle -->
                <i class="fas fa-question-circle text-c-blue mr-3" style="font-size: 45px;"></i>
                <p class="mb-0">Are you sure you wish to terminate this retrieval record?</p>
            </div>
            <p style="margin-left: 62px;" class="text-c-blue">
                Terminating this retrieval record will stop all invoice and data retrieval and publication
                activities for this account for this billing period.
            </p>
        </div>
        <div class="mt-2">
            <ng-container>
                <div class="text-right mt-4">
                    <a class="linkTag" (click)="terminateYes()">Yes, I'm sure</a>
                    <button class="btn btn-primary ml-4" (click)="dialogRef.close()">
                        No, cancel termination</button>
                </div>
            </ng-container>
        </div>
    </div>
</div>
