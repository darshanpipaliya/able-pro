<mat-tab-group [(selectedIndex)]="selected">
  <mat-tab label="vendor">

    <div class="col-sm-12">
      <ng-template mat-tab-label>
        <b><i class="fas fa-user-plus" style="color: #4680ff;"> </i> Vendor</b>
      </ng-template>
    </div>

    <div class="col-sm-12 mb-15 px-0" *ngIf="selected == 0">
      <ng-container>
        <div class="row">
          <div class="col-12 px-0">
            <app-card cardTitle="" [options]="false" [hidHeader]="true" class="card-bottom-none">
              <form class="addForm" [formGroup]="addVendorForm" (ngSubmit)="saveVendor()">
                <div class="row">
                  <div class="col-sm-12 col-xl-12 text-right">
                    <span class="text-c-red">*Required field</span>
                  </div>
                  <div class="col-sm-12 col-xl-6 padding-left-none">
                    <mat-accordion class="example-headers-align">
                      <div>
                        <mat-expansion-panel style="width: 100%;" [expanded]="true">
                          <mat-expansion-panel-header class="math">
                            <mat-panel-title class="matt">
                              <!-- <i class="ficon fas fa-id-card-alt"></i> -->
                              <i class="fas fa-user-plus"></i>&nbsp;Vendor
                            </mat-panel-title>
                          </mat-expansion-panel-header>

                          <div class="row m-t-20 mb-2">

                            <div class="col-md-6">
                              <div class="form-group">
                                <label class="form-label">Vendor *</label>
                                <span><input type="text" class="form-control" required formControlName="AccountName"
                                    spaceTrimStartEndInput [allowStartWithSpace]="false"
                                    [ngClass]="{'invalid-error': !f.AccountName.valid && (f.AccountName.dirty || f.AccountName.touched || isVendorFormSubmit)}"></span>
                                <ng-container
                                  *ngIf="f.AccountName.invalid && (f.AccountName.touched || isVendorFormSubmit)">
                                  <mat-error style="font-size: 12px;" *ngIf="f.AccountName.errors.required">Vendor is
                                    required
                                  </mat-error>
                                </ng-container>
                              </div>
                            </div>

                            <div class="col-md-6">
                              <div class="form-group">
                                <label class="form-label">Parent Vendor</label>
                                <span><p-dropdown
                                  [ngClass]="{'invalid-error': !f.ParentId.valid && (f.ParentId.dirty || f.ParentId.touched || isVendorFormSubmit)}"
                                  appendTo="body" [options]="parentVendorsList" optionLabel="AccountName"
                                  [filter]="true" filterBy="AccountName" 
                                  placeholder="Select Parent Vendor..." formControlName="ParentId"
                                  optionValue="Id">
                                </p-dropdown></span>
                                <ng-container
                                  *ngIf="f.ParentId.invalid && (f.ParentId.touched || isVendorFormSubmit)">
                                  <mat-error style="font-size: 12px;"
                                    *ngIf="f.ParentId.errors.required">Parent Vendor is required
                                  </mat-error>
                                </ng-container>
                              </div>
                            </div>

                            
                            <div class="col-md-12">
                              <div class="form-group">
                                <label for="exampleInputPassword1"> Website</label>
                                <span><input type="text" class="form-control"
                                    [allowStartWithSpace]="false" id="exampleInputPassword1"
                                    formControlName="WebAddress" spaceTrimStartEndInput
                                    ></span>
                              </div>
                            </div>
                          </div>
                          <div class="row m-t-20" #FixedDiv style="padding-bottom: 10px !important;">
                            <div class="col-md-12">
                              <div class="mb-2"><span style="font-weight: 500;">Upload Logo</span>
                                <i class="fas fa-info-circle ml-2" [placement]="'auto'" container="body"
                                  ngbTooltip="Image should be a PNG file and should not be blurry for best results "
                                  tooltipClass="tooltip-bg"></i>
                              </div>
                              <button type="button" class="btn sbubtn btn-primary btn-raised"
                                (click)="fileUpload.click()">Upload
                                Logo</button>
                              <input type="file" class="file-input" hidden (change)="onFileUploaded($event)"
                                #fileUpload>
                            </div>
                            <ng-container *ngIf="logoImage">
                              <div class="col-md-12 text-center m-t-10">
                                <div class="wrapper">
                                  <div class="content">
                                    <img class="logoimg" alt="test" width="200" height="100" [src]="logoImage">
                                    <a (click)="onFileUploadedRemove()"><i class="fas fa-times"></i></a>
                                  </div>
                                </div>
                              </div>
                            </ng-container>
                          </div>
                        </mat-expansion-panel>
                      </div>
                    </mat-accordion>
                    
                  </div>
                  <div class="col-sm-12 col-xl-6 padding-right-none">
                    <mat-accordion class="example-headers-align">
                      <div>
                        <mat-expansion-panel style="width: 100%;" [expanded]="true">
                          <mat-expansion-panel-header class="math">
                            <mat-panel-title class="matt">
                              <!-- <i class="ficon fas fa-id-card-alt"></i> -->
                              <i class="fas fa-user-plus"></i>&nbsp;Industry
                            </mat-panel-title>
                          </mat-expansion-panel-header>
                          <div>
                            <dual-list [source]="source" [key]="key" [display]="display"
                              [filter]="filter" [(destination)]="confirmed" height="158px" [format]="format"
                              [disabled]="disabled"></dual-list>
                          </div>
                        </mat-expansion-panel>
                      </div>
                    </mat-accordion>
                  </div>
                  <div class="col-md-12">

                    <div class="form-group text-center margin-b-none">
                      <button type="submit" uiSref="work" class="btn  btn-primary btn-raised"
                        [disabled]="saveButtonLoadder || !viewNEdit">Save
                      </button>
                    </div>
                  </div>
                </div>
              </form>
            </app-card>
          </div>
        </div>
      </ng-container>
    </div>
  </mat-tab>

    <div class="col-sm-12 mb-15 px-0" *ngIf="selected == 1">
      <ng-container>
        <app-invoice-data-retrival [type]="'add'" [vendorData]="vendorDataPass">

        </app-invoice-data-retrival>
      </ng-container>
    </div>
  </mat-tab>

</mat-tab-group>
