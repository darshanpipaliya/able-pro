<div class="mat-dialog-header pb-2">
    <div>
        <h5 class="modal-title text-c-blue" id="exampleModalLabel">Enter the secure passcode</h5>
    </div>

    <button type="button" class="close" [mat-dialog-close]="'undefined'">
        <span aria-hidden="true">&times;</span>
    </button>
</div>
<div mat-dialog-content class="px-0 m-0">

    <div class="container px-0">
        <div class="row mx-0 px-2 align-items-center">
            <div class="col-md-12 popup-main-section px-0">
                <div class="popup-left-icon">
                    <i class="fas fa-exclamation-circle text-c-blue f-70"></i>
                </div>
                <div class="popup-right-desc">
                    <form [formGroup]="otpForm">

                        <p class="mt-3 mb-0" style="font-size: 16px;">Please check your email and enter the secure passcode below to login.</p>
                        <input type="text" class="my-2 form-control otp" maxlength="6" formControlName="otp" Require OnlyNumber
                            [ngClass]="{'invalid-error': f['otp']['invalid'] && (f['otp']['touched'] || isOtpFormSubmit)}"
                            spaceTrimStartEndInput [allowStartWithSpace]="false" 
                            aria-describedby="basic-addon2">

                        <ng-container *ngIf="f['otp']['invalid'] && (f['otp']['touched'] || isOtpFormSubmit)">
                            <mat-error style="font-size: 13px;color: #ff5252;position: relative;top: -5px;" *ngIf="f['otp']['errors']['required']">Please enter
                                OTP.
                            </mat-error>
                        </ng-container>
                        <p class="mb-1" style="font-size: 14px;"><i>This code will expire in 10 minutes</i></p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<mat-dialog-actions class="pt-0 m-0" align="end">
    <button mat-button class="btn btn-primary" (click)="close()">
        <!-- <span class="spinner-border spinner-border-sm mr-2"></span> -->
        Cancel</button>

    <button mat-button class="btn btn-primary ml-2" (click)="finish()" [disabled]="saveButtonLoadder">
        <span class="spinner-border spinner-border-sm mr-2" *ngIf="saveButtonLoadder"></span>
        Finish</button>

</mat-dialog-actions>
<div class="link-section mt-2">
    <span> Having problems ? </span>
    <button class="text-primary ml-3" style="text-decoration: underline;" (click)="resendOtp()">
        <!-- <span class="spinner-border spinner-border-sm mr-2"></span> -->
        Resend code</button>

    <button class="text-primary ml-3" style="text-decoration: underline;" (click)="support()">
        <!-- <span class="spinner-border spinner-border-sm mr-2"></span> -->
        <a target="_top" id="someLink">Email Support</a></button>
</div>
