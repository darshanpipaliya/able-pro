<form class="editForm" [formGroup]="addVendorBillingAliasForm">
    <div class="row new-billing-alias-tab-box">
        <div class="col-sm-12 col-xl-12 text-right">
            <span class="text-c-red">*Required field</span>
        </div>
        <div class="col-sm-12 col-xl-6 col-md-6 px-0">
            <mat-accordion class="example-headers-align">
                <mat-expansion-panel [expanded]="true">
                    <mat-expansion-panel-header class="math borderc">
                        <mat-panel-title class="matt">
                            <i class="ficon fas fa-user-ninja"></i>&nbsp;Billing Alias
                        </mat-panel-title>

                    </mat-expansion-panel-header>
                    <div class="row m-t-20">
                        <div class="col-md-12 custome-fields">
                            <div class="form-group">
                                <label class="form-label">Vendor *</label>
                                <span>
                                    <p-dropdown appendTo="body" [options]="vendorsList" optionLabel="AccountName"
                                        [filter]="true" filterBy="AccountName" [showClear]="true"
                                        [ngClass]="{'invalid-error': f['vendorAccountId'].invalid && (f['vendorAccountId'].touched || isFormSubmit)}"
                                        placeholder="Select Vendor..." formControlName="vendorAccountId"
                                        optionValue="Id" [showClear]="false"></p-dropdown>
                                </span>
                                <ng-container
                                    *ngIf="f['vendorAccountId'].invalid && (f['vendorAccountId'].touched || isFormSubmit)">
                                    <mat-error style="font-size: 12px;" *ngIf="f['vendorAccountId'].errors.required">Vendor
                                        is required
                                    </mat-error>
                                </ng-container>
                            </div>
                        </div>
                        <div class="col-md-12 custome-fields">
                            <div class="form-group">
                                <label class="form-label">Vendor Billing Alias *</label>
                                <span> <input class="form-control" formControlName="name"
                                        [ngClass]="{'invalid-error': !f['name'].valid && (f['name'].dirty || f['name'].touched || isFormSubmit)}"
                                        spaceTrimStartEndInput [allowStartWithSpace]="false"></span>
                                <ng-container *ngIf="f['name'].invalid && (f['name'].touched || isFormSubmit)">
                                    <mat-error style="font-size: 12px;" *ngIf="f['name'].errors.required">Vendor Billing
                                        Alias is required
                                    </mat-error>
                                </ng-container>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12 px-0">
                            <div class="form-group">
                                <label class="form-label">Description </label>
                                <span>
                                    <input type="text" class="form-control"
                                    formControlName="description"
                                    [disabled]="!isSuperTEMAdmin && !isSuperTEMManager">
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12 custome-fields">
                            <div class="form-group">
                                <label class="form-label">Status * </label>
                                <span>
                                    <p-dropdown [options]="statusList" optionLabel="Name" [filter]="false"
                                        filterBy="Name" [showClear]="true" placeholder="Select Status..." [disabled]="true"
                                        formControlName="status" appendTo="body" optionValue="Id" [showClear]="false"
                                        [ngClass]="{'invalid-error': f['status'].invalid && (f['status'].touched || isFormSubmit)}">
                                    </p-dropdown>
                                </span>
                                <ng-container *ngIf="f['status'].invalid && (f['status'].touched || isFormSubmit)">
                                    <mat-error style="font-size: 12px;" *ngIf="f['status'].errors.required">Status is
                                        required
                                    </mat-error>
                                </ng-container>
                            </div>
                        </div>
                    </div>
                    <div class="row d-flex">
                        <div style="padding-right: 30px;">
                            <div class="form-group">
                                <div class="form-check pl-0" style="display: flex; align-items: center;">
                                    <label for="charge-code-check" class="form-check-label pr-1"
                                        style="font-weight: 500;">
                                        Charge Code Alias </label>
                                    <input type="checkbox" formControlName="chargeCodeAlias"
                                        [disabled]="!isSuperTEMAdmin && !isSuperTEMManager" id="charge-code-check"
                                        class="form-check-inner">

                                </div>
                            </div>
                        </div>
                        <div>
                            <div class="form-group">
                                <div class="form-check pl-0" style="display: flex; align-items: center;">

                                    <label for="defaultCheck1" class="form-check-label pr-1" style="font-weight: 500;">
                                        Payable Alias </label>
                                    <input type="checkbox" formControlName="invoiceAlias"
                                        [disabled]="!isSuperTEMAdmin && !isSuperTEMManager" id="defaultCheck1"
                                        class="form-check-inner">
                                </div>
                            </div>
                        </div>
                    </div>

                </mat-expansion-panel>
            </mat-accordion>
            <div class="form-group text-center margin-b-none">
                <button type="submit" uiSref="work" class="btn sbubtn btn-primary btn-raised"
                    [disabled]="!viewNEdit || saveButtonLoadder"
                    (click)="addBillingAlias()">Save</button>
            </div>
        </div>
    </div>
</form>
