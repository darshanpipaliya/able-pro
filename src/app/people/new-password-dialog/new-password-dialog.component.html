<div class="app-add-product-structure-dialog-c">
    <div class="mat-dialog-header pb-2">
        <h5 class="modal-title" id="exampleModalLabel" style="color: #4680ff;">Set New Password</h5>
        <button type="button" class="close" mat-dialog-close>
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

    <div mat-dialog-content>
        <div class="container-fluid px-0">
            <div class="card-body py-0 px-0 pt-3">
                <form [formGroup]="passwordForm">
                    <div class="row m-t-20 mb-0">
                        <div class="col-md-6 padding-0-3">
                            <div class="form-group">
                                <label class="plab" for="exampleInputPassword1" style="font-weight: 500;"> New
                                    Password</label>
                                <span><mat-form-field appearance="fill" style="width: 100%; margin-left: 6px">
                                        <input matInput [type]="hide ? 'password' : 'text'" id="NewPassword"
                                            spaceTrimStartEndInput [allowStartWithSpace]="false"
                                            formControlName="NewPassword" (input)="setValidation($event)"
                                            [ngClass]="{'invalid-error': !passwordForm.get('NewPassword')?.valid && (passwordForm.get('NewPassword')?.dirty || passwordForm.get('NewPassword')?.touched || isUserFormSubmit)}">
                                        <button type="button" class="vbut" mat-icon-button matSuffix
                                            (click)="hide = !hide" [attr.aria-label]="'Hide NewPassword'"
                                            [attr.aria-pressed]="hide">
                                            <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                                        </button>
                                    </mat-form-field></span>
                            </div>
                            <ng-container *ngIf="passwordForm.get('NewPassword')?.invalid && (passwordForm.get('NewPassword')?.touched || isUserFormSubmit)">
                                <mat-error style="font-size: 12px; position: relative;"
                                    *ngIf="passwordForm.get('NewPassword')?.invalid && passwordForm.get('NewPassword')?.errors.required">
                                    Password is required
                                </mat-error>
                                <mat-error style="font-size: 12px; position: relative;top: 40px;"
                                    *ngIf="!passwordForm.get('NewPassword')?.valid && !passwordForm.get('NewPassword')?.errors.required">
                                    Password must have at least:<br>
                                    <ol>
                                        <ul style="margin-left: -45px;">
                                            <li>8 characters</li>
                                            <li>1 number and 1  special character</li>
                                            <li>1 upper case and 1 lower case letter</li>
                                        </ul>
                                    </ol>
                                </mat-error>
                            </ng-container>
                        </div>

                        <div class="col-md-6 padding-3-0">
                            <div class="form-group">
                                <label class="plab" for="exampleInputPassword1" style="font-weight: 500;">
                                    Confirm New Password </label>
                                <span> <mat-form-field appearance="fill" style="width: 100%; margin-left: 6px;">

                                        <input matInput [type]="cphide ? 'password' : 'text'" id="NewPassword"
                                            spaceTrimStartEndInput [allowStartWithSpace]="false"
                                            formControlName="ConfirmPassword"
                                            [ngClass]="{'invalid-error': !passwordForm.get('ConfirmPassword')?.valid && (passwordForm.get('ConfirmPassword')?.dirty || passwordForm.get('ConfirmPassword')?.touched || isUserFormSubmit)}">
                                        <button type="button" class="vbut" mat-icon-button matSuffix
                                            (click)="cphide = !cphide" [attr.aria-label]="'Hide NewPassword'"
                                            [attr.aria-pressed]="hide">
                                            <mat-icon>{{cphide ? 'visibility_off' : 'visibility'}}</mat-icon>
                                        </button>
                                    </mat-form-field></span>
                            </div>
                            <ng-container
                                *ngIf="passwordForm.get('ConfirmPassword')?.invalid && (passwordForm.get('ConfirmPassword')?.touched || isUserFormSubmit)">
                                <mat-error style="font-size: 12px; position: relative;"
                                    *ngIf="passwordForm.get('ConfirmPassword')?.errors.required">
                                    Confirm Password is required</mat-error>
                                <mat-error style="font-size: 12px; position: relative;"
                                    *ngIf="passwordForm.get('ConfirmPassword')?.errors.confirmedValidator">
                                    Passwords must match</mat-error>
                            </ng-container>
                        </div>
                        <div class="col-md-6 padding-0-3"></div>

                    </div>

                </form>
            </div>
        </div>
    </div>
    <mat-dialog-actions align="end" class="pt-0">
        <a class="linkTag" (click)="closeDialog()"> Do not change password </a>
        <!--<button mat-button mat-dialog-close class="btn btn-primary">Cancel</button>-->
        <button mat-button (click)="savePassword()" class="btn btn-primary ml-3" cdkFocusInitial
            [disabled]="saveButtonLoader"><span class="spinner-border spinner-border-sm mr-1" role="status" *ngIf="saveButtonLoader"></span>Save</button>
    </mat-dialog-actions>
</div>
