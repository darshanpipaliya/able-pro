<div class="contacts-list-popup m-0">
    <div class="mat-dialog-header pb-1" style="border: none;">
        <h5 class="modal-title"> <svg [ngClass]="{'disabled': loader}" class="pc-icon text-primary circle-icon"
            (click)="refreshbuttonEmitFn(true)">
            <use xlink:href="assets/fonts/custom-icon.svg#refreshCircle"></use>
        </svg> Link Wireline Inventory for Location:  {{emitedData?.LocationName}} {{emitedData?.Address1}} {{emitedData?.City}} {{emitedData?.StateName}}
        </h5>
        <i style="padding: 5px !important;" class="fas fa-times" [mat-dialog-close]="close"></i>
    </div>

    <div class="mat-dialog-content">
       
            <div class="location-contact-dialog">
                <app-common-p-tree-table [refreshbutton]="refreshbutton" [payload]="payload" [GridAPI]="GridAPI"
                [selectionField]="'InventoryLocationAtt'" [selectionFieldWithValues]="'Yes'" [multipleSelection]="true"
                (tableDataExist)="tableDataExistFn($event)" [cols]="cols" [preAppliedfilterArr]="preAppliedfilterArr"
                (exportAccountData)="exportAccountDataFn($event)" (selectedRowsEmit)="selectedRowsEmitFn($event)"
                (rowCellDoubleClicked)="rowCellDoubleClickedFn($event)"
                (refreshbuttonEmit)="refreshbuttonEmitFn($event)" (totalRecordsEmit)="totalRecordsEmitFn($event)"
                (loaderEmit)="loaderEmitFn($event)" />

            </div>
  
    </div>

    <mat-dialog-actions align="Center">
        <button type="submit" uiSref="work" class="btn btn-primary btn-raised" (click)="setInventory()"
            [disabled]="totalRecords === 0 || saveButtonDisabled">
            <span class="spinner-border spinner-border-sm" role="status" *ngIf="saveButtonDisabled"></span>
            Save</button>
    </mat-dialog-actions> 
</div>
