<mat-accordion [ngClass]="className ? className : 'change-log-sec-multi'">
  <mat-expansion-panel class="custom-panel border" [expanded]="true" [hideToggle]="true" [disabled]="true">
    <mat-expansion-panel-header class="custom-header">
      <div class="header-content">
        <span class="">
          <svg class="pc-icon text-primary circle-icon" (click)="changeLogData()">
            <use xlink:href="assets/fonts/custom-icon.svg#refreshCircle"></use>
          </svg>
        </span>
        <mat-panel-title class="panel-title">
          <img src="assets/images/fa-sharp-fas-fa-swap.svg" class="text-primary " alt="Change Log Image"> &nbsp;
          <span class="fs-14 fw-bold text-dark">{{title}} Change Log</span>
        </mat-panel-title>
      </div>
    </mat-expansion-panel-header>
    <ng-container *ngIf="loadingDataFromApi || logLoader">
      <div class="col-md-12 col-sm-12 col-xl-12 padding-1-3 padding-1-3-wireline shimmer-res">
        <div class="line shimmer"></div>
      </div>
      <div class="col-md-12 col-sm-12 col-xl-12 padding-3-3 padding-3-1-wireline shimmer-res">
        <div class="line shimmer"></div>
      </div>
      <div class="col-md-12 col-sm-12 col-xl-12 padding-1-3 padding-1-3-wireline shimmer-res">
        <div class="line shimmer"></div>
      </div>
      <div class="col-md-12 col-sm-12 col-xl-12 padding-3-3 padding-3-1-wireline shimmer-res">
        <div class="line shimmer"></div>
      </div>
      <div class="col-md-12 col-sm-12 col-xl-12 padding-1-3 padding-1-3-wireline shimmer-res">
        <div class="line shimmer"></div>
      </div>
      <div class="col-md-12 col-sm-12 col-xl-12 padding-3-3 padding-3-1-wireline shimmer-res">
        <div class="line shimmer"></div>
      </div>
    </ng-container>
    <ng-container *ngIf="!loadingDataFromApi && !logLoader">
      <div class="tbData" [style]="{'height': height}">
        <p-table [columns]="column" [tableStyle]="{ 'width': '100%' }" [value]="changelogData">
          <ng-template pTemplate="header" let-columns>
            <tr>
              <th *ngFor="let col of columns">
                {{ col.header }}
              </th>
            </tr>
          </ng-template>

          <ng-template pTemplate="body" let-rowData let-columns="columns">
            <tr>
              <td *ngFor="let col of columns">
                <ng-container [ngSwitch]="col.field">
                  <div *ngSwitchCase="'ModificationDate'">
                    {{ convertToDateTime(rowData[col.field]) }}
                  </div>
                  <div *ngSwitchCase="'timeDate'">
                    {{ convertToDateTime(rowData[col.field]) }}
                  </div>
                  <div *ngSwitchCase="'action'">
                    {{ rowData[col.field] }}
                  </div>
                  <div *ngSwitchDefault>{{ rowData[col.field] }}</div>
                </ng-container>

              </td>
            </tr>
          </ng-template>
        </p-table>
      </div>
    </ng-container>
  </mat-expansion-panel>
</mat-accordion>
