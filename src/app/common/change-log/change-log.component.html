<!-- Change Log Section Start -->
<mat-accordion class="example-headers-align change-log-sec-multi"
  [ngClass]="className ? className : 'change-log-sec-multi'">
  <mat-expansion-panel style="width: 100%; margin: 10px 0 0 !important;" [expanded]="true" [disabled]="true"
    class="padding-none">
    <button type="button" class="fas fa-check c-refresh-speed" title="Refresh" (click)="changeLogData()"></button>
    <mat-expansion-panel-header class="math">
      <mat-panel-title class="matt">
        <img src="assets/images/fa-sharp-fas-fa-swap.svg" alt="Change Log Image">&nbsp;{{title}} Change Log
      </mat-panel-title>
    </mat-expansion-panel-header>
    <ng-container *ngIf="loadingDataFromApi || logLoader">
      <div class="col-md-12 col-sm-12 col-xl-12 padding-1-3 padding-1-3-wireline shimmer-res">
        <div class="line shimmer"></div>
      </div>
      <div class="col-md-12 col-sm-12 col-xl-12 padding-3-3 padding-3-1-wireline shimmer-res">
        <div class="line shimmer"></div>
      </div>
      <div class="col-md-12 col-sm-12 col-xl-12 padding-1-3 padding-1-3-wireline shimmer-res">
        <div class="line shimmer"></div>
      </div>
      <div class="col-md-12 col-sm-12 col-xl-12 padding-3-3 padding-3-1-wireline shimmer-res">
        <div class="line shimmer"></div>
      </div>
      <div class="col-md-12 col-sm-12 col-xl-12 padding-1-3 padding-1-3-wireline shimmer-res">
        <div class="line shimmer"></div>
      </div>
      <div class="col-md-12 col-sm-12 col-xl-12 padding-3-3 padding-3-1-wireline shimmer-res">
        <div class="line shimmer"></div>
      </div>
    </ng-container>
    <ng-container *ngIf="!loadingDataFromApi && !logLoader">
      <div class="tbData">
        <p-table [columns]="column" [tableStyle]="{ 'width': '100%' }" [value]="changelogData">
          <ng-template pTemplate="header" let-columns>
            <tr>
              <th *ngFor="let col of columns">
                {{ col.header }}
              </th>
            </tr>
          </ng-template>

          <ng-template pTemplate="body" let-rowData let-columns="columns">
            <tr>
              <td *ngFor="let col of columns">
                <ng-container [ngSwitch]="col.field">
                  <div *ngSwitchCase="'ModificationDate'">
                    {{ convertToDateTime(rowData[col.field]) }}
                  </div>
                  <div *ngSwitchCase="'timeDate'">
                    {{ convertToDateTime(rowData[col.field]) }}
                  </div>
                  <div *ngSwitchCase="'action'">
                    {{ rowData[col.field] }}
                  </div>
                  <div *ngSwitchDefault>{{ rowData[col.field] }}</div>
                </ng-container>

              </td>
            </tr>
          </ng-template>
        </p-table>
      </div>
    </ng-container>
  </mat-expansion-panel>
</mat-accordion>
<!-- Change Log Section End -->
