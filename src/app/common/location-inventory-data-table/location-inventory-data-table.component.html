<mat-accordion>
    <mat-expansion-panel class="custom-panel border" [expanded]="true" [hideToggle]="true" [disabled]="true">
        <mat-expansion-panel-header class="custom-header">
            <div class="header-content">
                <div title="Export"
                    class="d-flex align-items-center justify-content-center rounded-circle border border-success text-success circle-icon"
                    [ngClass]="{'disabled': loader || isDisableExportBtn || totalRecords === 0}"
                    (click)="onBtnExportDataAsExcel()">
                    <i
                        class="text-success {{isDisableExportBtn ? 'spinner-border spinner-border-sm' : 'fas fa-solid fas fa-file-excel'}}"></i>

                </div>
                <div class="d-flex  circle-icon align-items-center justify-content-center rounded-circle border border-warning text-warning"
                    [ngClass]="{'disabled pointer-events-none': loader || CompanyUser}" (click)="openInventoryGrid()"
                    title="Link / Unlink Inventory">
                    <i class="fas fa-edit text-warning"></i>
                </div>

                <span class="">
                    <svg [ngClass]="{'disabled': loader}" class="pc-icon text-primary circle-icon"
                        (click)="refreshbuttonEmitFn(true)">
                        <use xlink:href="assets/fonts/custom-icon.svg#refreshCircle"></use>
                    </svg></span>
                <mat-panel-title class="panel-title">
                    <i class="ficon fas fa-clipboard-list" style="color: #4680ff;"></i> &nbsp;
                    <span class="fs-6 fw-bold text-dark">Wireline Inventory</span>
                </mat-panel-title>
            </div>
        </mat-expansion-panel-header>

        <app-common-p-tree-table [refreshbutton]="refreshbutton" [payload]="payload" [GridAPI]="GridAPI"
            (tableDataExist)="tableDataExistFn($event)" [cols]="cols" [preAppliedfilterArr]="preAppliedfilterArr"
            (exportAccountData)="exportAccountDataFn($event)" (selectedRowsEmit)="selectedRowsEmitFn($event)"
            (rowCellDoubleClicked)="rowCellDoubleClickedFn($event)"
            (refreshbuttonEmit)="refreshbuttonEmitFn($event)" (totalRecordsEmit)="totalRecordsEmitFn($event)"
            (loaderEmit)="loaderEmitFn($event)" />
    </mat-expansion-panel>
</mat-accordion>
