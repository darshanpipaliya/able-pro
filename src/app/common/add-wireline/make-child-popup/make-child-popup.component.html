<div class="mat-dialog-header pb-2">
    <div>
        <h5 class="modal-title" id="exampleModalLabel">Update this Parent Record to be a Child of Another Parent</h5>
    </div>

    <button type="button" class="close" mat-dialog-close>
        <span aria-hidden="true">&times;</span>
    </button>
</div>
<div mat-dialog-content>
    <div class="card-body py-0">
        <div class="container px-0">
            <form class="editForm px-0" [formGroup]="inventoryForm">

                <div class="row mt-2">
                    <div class="col-sm-12 col-xl-12 col-md-12 p-0">
                        <h5 class="modal-title" id="exampleModalLabel">Current Inventory - is a Parent or Individual
                            Inventory Record</h5>
                        <div class="row m-t-10">
                            <div class="col-md-6 col-sm-12 col-xl-3 padding-1-3 padding-1-3-make-child">
                                <div class="form-group"> <label class="form-label">Customer</label>
                                    <p-dropdown [options]="customerList" optionLabel="AccountName" [filter]="true"
                                        filterBy="AccountName" [showClear]="true" [disabled]="true"
                                        placeholder="{{loadingCustomerList ? 'Loading' : 'Select Customer'}}..."
                                        formControlName="customerId" optionValue="Id" [showClear]="false"
                                        appendTo="body">
                                    </p-dropdown>
                                </div>
                            </div>
                            <div class="col-md-6 col-sm-12 col-xl-3 padding-3-1 padding-3-1-make-child">
                                <div class="form-group"> <label class="form-label">Vendor</label>
                                    <p-dropdown [options]="inventoryData.vendorList" optionLabel="AccountName" [filter]="true" [disabled]="true"
                                        filterBy="AccountName" [showClear]="true" placeholder="Select Vendor..." 
                                        formControlName="VendorIdDisplay" optionValue="Id" [showClear]="false" appendTo="body">
                                    </p-dropdown>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 col-sm-12 col-xl-3 padding-1-3 padding-1-3-make-child">
                                <div class="form-group"> <label class="form-label">Main Account Number</label>
                                    <input class="form-control" formControlName="BillingAccountHierarchyIdDisplay" disabled>
                                </div>
                            </div>
                            <div class="col-md-6 col-sm-12 col-xl-3 padding-3-3 padding-3-1-make-child">
                                <div class="form-group"> <label class="form-label">Sub Account Number</label>
                                    <input class="form-control" formControlName="subAccountNumberDisplay" disabled>
                                </div>
                            </div>
                            <div class="col-md-6 col-sm-12 col-xl-3 padding-3-3 padding-1-3-make-child">
                                <div class="form-group"> <label class="form-label">Payable Account Number</label>
                                    <input class="form-control" formControlName="payableAccountNumberDisplay" disabled>
                                </div>
                            </div>
                            <div class="col-md-6 col-sm-12 col-xl-3 pr-1 padding-3-1 padding-3-1-make-child">
                                <div class="form-group">
                                    <label class="form-label">Is this Inventory Item a Phone Number?</label>
                                        <mat-radio-group formControlName="isPhoneNumber" disabled
                                            class="m-l-8 d-inline-block">
                                            <mat-radio-button [value]="true">Yes
                                            </mat-radio-button>
                                            <mat-radio-button [value]="false" class="m-l-10">No
                                            </mat-radio-button>
                                        </mat-radio-group>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 col-sm-12 col-xl-3 padding-1-3 padding-1-3-make-child">
                                <div class="form-group"> <label class="form-label">Service Number</label> <input
                                        class="form-control" formControlName="serviceNumber" disabled> </div>
                            </div>
                            <div class="col-md-6 col-sm-12 col-xl-3 padding-3-3 padding-3-1-make-child">
                                <div class="form-group"> <label class="form-label">Billing ID</label> <input
                                        class="form-control" formControlName="billingId" disabled>
                                </div>
                            </div>
                            <div class="col-md-6 col-sm-12 col-xl-3 padding-3-3 padding-1-3-make-child">
                                <div class="form-group"> <label class="form-label">Inventory Origin
                                    </label>
                                    <input class="form-control" formControlName="InventoryOriginId" disabled>
                                </div>
                            </div>
                            <div class="col-md-6 col-sm-12 col-xl-3 padding-3-1 padding-3-1-make-child">
                                <div class="form-group"> <label class="form-label">Status
                                    </label>
                                    <p-dropdown [options]="inventoryStatusList" appendTo="body" [disabled]="true"
                                    optionLabel="DisplayText" [filter]="true" filterBy="DisplayText" [showClear]="true"
                                     placeholder="{{loadingInventorySts ? 'Loading': 'Select status'}}..."
                                    formControlName="statusId" optionValue="Id" [showClear]="false">
                                  </p-dropdown>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 col-sm-12 col-xl-3 padding-1-3 padding-1-3-make-child">
                                <div class="form-group"> <label class="form-label">Service</label>
                                    <input class="form-control" formControlName="service" disabled>
                                </div>
                            </div>
                            <div class="col-md-6 col-sm-12 col-xl-3 padding-3-3 padding-3-1-make-child">
                                <div class="form-group"> <label class="form-label">Service Type</label>
                                    <input class="form-control" formControlName="serviceType" disabled>
                                </div>
                            </div>
                            <div class="col-md-6 col-sm-12 col-xl-3 padding-3-3 padding-1-3-make-child">
                                <div class="form-group"> <label class="form-label">Product</label>
                                    <input class="form-control" formControlName="product" disabled>
                                </div>
                            </div>
                            <div class="col-md-6 col-sm-12 col-xl-3 padding-3-1 padding-3-1-make-child">
                                <div class="form-group"> <label class="form-label">Product Type</label>
                                    <input class="form-control" formControlName="productType" disabled>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 col-sm-12 col-xl-3 padding-1-3 padding-1-3-make-child">
                                <div class="form-group"> <label class="form-label">Vendor Product</label>
                                    <p-dropdown [options]="inventoryData.vendorProductDetails" optionLabel="Name" [filter]="true" filterBy="Name"
                                    [showClear]="true" appendTo="body" formControlName="vendorProductTypeId" optionValue="Id" [showClear]="false"
                                    [disabled]="true">
                                  </p-dropdown>
                                </div>
                            </div>

                            <div class="col-md-6 col-sm-12 col-xl-3 padding-3-3 padding-3-1-make-child">
                                <div class="form-group"> <label class="form-label">Vendor Product Description
                                    </label>
                                    <input class="form-control" formControlName="vendorProductInventoryDescription" disabled>
                                </div>
                            </div>
                            <div class="col-md-6 col-sm-12 col-xl-3 padding-3-3 padding-1-3-make-child">
                                <div class="form-group"> <label class="form-label"># of Children Assigned
                                    </label>
                                    <input class="form-control" formControlName="assignedChildren" disabled>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12 pl-0 mt-2">
                        <h5 class="modal-title" id="exampleModalLabel">Select New Parent Record for Inventory Assignment
                            <i class="fas fa-info-circle" container="body"
                                ngbTooltip="Search for a new Parent Inventory record by Location, Service Number, Vendor, Account, and other fields in order to locate and select the Parent record for this inventory item"
                                tooltipClass="tooltip-bg"></i>
                        </h5>

                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-12 col-xl-12 col-md-12 m-t-10 change-parent-grid p-0">

                        <app-select-inventory-make-child [inventoryData]="inventoryData"
                        (selectedRowsEmit)="onSelectionChanged($event)">
                            
                        </app-select-inventory-make-child>
                        
                    </div>
                </div>
            </form>
        </div>
    </div>
</div><mat-dialog-actions class="py-3" align="center">
    <!----<button mat-button mat-dialog-close class="btn btn-primary">Cancel</button>--> <button mat-button (click)="saveChild()"
        class="btn btn-primary" [disabled]="saveButtonLoader || !isRowSelected">
        <span class="spinner-border spinner-border-sm" role="status" *ngIf="saveButtonLoader"></span>
        Save</button></mat-dialog-actions>
